<!DOCTYPE html>
<html>
<head>
    <title>Lead Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>🚗 Leads Dashboard</h2>

<div style="margin-bottom: 20px;">
    <select id="filter" onchange="loadLeads()">
        <option value="">All Leads</option>
        <option value="HOT">🔥 HOT</option>
        <option value="WARM">🟡 WARM</option>
        <option value="COLD">⚪ COLD</option>
    </select>
</div>
<div id="analytics" style="display:flex; gap:20px; margin-bottom:20px;">
    <div>Total: <span id="total"></span></div>
    <div>🔥 HOT: <span id="hot"></span></div>
    <div>🟡 WARM: <span id="warm"></span></div>
    <div>⚪ COLD: <span id="cold"></span></div>
    <div>📩 Enquiry: <span id="enquiry"></span></div>
    <div>🚗 Test Drive: <span id="testdrive"></span></div>
    <div>✅ Closed: <span id="closed"></span></div>
</div>
<div style="display:flex; gap:40px; margin-top:30px;">
    
    <div style="width:400px;">
        <h4>Lead Priority</h4>
        <canvas id="priorityChart"></canvas>
    </div>

    <div style="width:400px;">
        <h4>Customer Actions</h4>
        <canvas id="actionChart"></canvas>
    </div>

</div>
<table id="leadTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Car</th>
            <th>Action</th>
            <th>Score</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Actions</th>  
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="./js/admin.js"></script>
</body>
</html>
