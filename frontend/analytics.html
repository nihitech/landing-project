<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./css/styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><title>📈 Analytics</title></head><body class="crm-v2"><div class="crm-layout"><div id="sidebarContainer"></div><main class="main-content"><header class="module-header"><div><span class="tag">Dealer CRM</span><h1>📈 Analytics</h1></div><div class="module-actions"><div class="notification-box"><button onclick="toggleNotifications()" class="notification-btn">🔔 <span id="notificationCount">0</span></button><div id="notificationPanel" class="notification-panel"><h3>Notifications</h3><div id="notificationList"></div></div></div><button onclick="logout()" class="logout-btn">Logout</button></div></header><section class="dashboard-stats compact"><div class="dash-card">Total <span id="total">0</span></div><div class="dash-card">Enquiry <span id="enquiry">0</span></div><div class="dash-card">Test Drive <span id="testdrive">0</span></div><div class="dash-card">Closed <span id="closed">0</span></div></section><section class="two-column"><div class="chart-card"><h3>Priority Mix</h3><canvas id="priorityChart"></canvas></div><div class="chart-card"><h3>Action Funnel</h3><canvas id="actionChart"></canvas></div></section><section class="module-card"><h2>Source Breakdown</h2><div id="sourceBreakdown"></div></section></main></div><script src="./js/crm-common.js"></script><script>loadLayout('analytics');</script><script src="./js/analytics.js"></script></body></html>
