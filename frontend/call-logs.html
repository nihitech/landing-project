<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Call Logs</title><link rel="stylesheet" href="./css/styles.css"></head><body class="crm-v2"><div class="crm-layout"><div id="sidebarContainer"></div><main class="main-content"><header class="module-header"><div><span class="tag">Call Accountability</span><h1>☎️ Call Logs & Recordings</h1><p>Customer call updates, recording links, summaries and follow-up accountability.</p></div><div class="module-actions"><button onclick="openCallModal()" class="save-btn">+ Add Call Log</button><button onclick="loadCallLogs()" class="copy-btn">Refresh</button><button onclick="logout()" class="logout-btn">Logout</button></div></header><section class="workspace-kpi-grid"><div class="summary-card"><span>Total Calls</span><strong id="totalCalls">0</strong></div><div class="summary-card"><span>Completed</span><strong id="completedCalls">0</strong></div><div class="summary-card"><span>Recordings</span><strong id="recordedCalls">0</strong></div><div class="summary-card"><span>Minutes</span><strong id="totalMinutes">0</strong></div></section><section class="table-card"><div class="page-header"><h2>Recent Call Logs</h2><p>Every update is saved with employee details.</p></div><table class="report-table"><thead><tr><th>Customer</th><th>Call</th><th>Summary</th><th>Recording</th><th>Employee</th></tr></thead><tbody id="callTable"></tbody></table></section></main></div><div id="callModal" class="followup-modal"><div class="followup-modal-card"><h2>Add Call Log</h2><div class="form-grid"><div class="field-group"><label>Lead ID</label><input id="callLeadId"></div><div class="field-group"><label>Customer Name</label><input id="callCustomerName"></div><div class="field-group"><label>Phone</label><input id="callPhone"></div><div class="field-group"><label>Call Type</label><select id="callType"><option value="FOLLOW_UP">Follow-up</option><option value="QUALIFICATION">Qualification</option><option value="BOOKING">Booking</option><option value="TEST_DRIVE">Test Drive</option></select></div><div class="field-group"><label>Status</label><select id="callStatus"><option value="COMPLETED">Completed</option><option value="NO_RESPONSE">No Response</option><option value="CALL_BACK">Call Back</option><option value="NOT_INTERESTED">Not Interested</option></select></div><div class="field-group"><label>Duration Seconds</label><input id="callDuration" type="number" value="0"></div><div class="field-group"><label>Next Follow-up</label><input id="callNextFollowup" type="datetime-local"></div><div class="field-group"><label>Recording URL</label><input id="callRecordingUrl"></div></div><label>Customer Response</label><textarea id="callResponse"></textarea><label>Summary / Notes</label><textarea id="callSummary"></textarea><div class="followup-modal-actions"><button onclick="closeCallModal()" class="cancel-btn">Cancel</button><button onclick="saveCallLog()" class="save-btn">Save Call Log</button></div></div></div><script src="./js/crm-common.js"></script><script>loadLayout('call-logs');</script><script src="./js/call-logs.js"></script></body></html>
