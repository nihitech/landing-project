<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notifications</title><link rel="stylesheet" href="./css/styles.css"></head><body class="crm-v2"><div class="crm-layout"><div id="sidebarContainer"></div><main class="main-content"><header class="module-header"><div><span class="tag">Notification Engine</span><h1>🔔 Notifications & Escalations</h1><p>Approval alerts, missed follow-ups, task reminders and escalation queue.</p></div><div class="module-actions"><button onclick="scanNotifications()" class="save-btn">Scan Now</button><button onclick="loadNotifications()" class="copy-btn">Refresh</button><button onclick="logout()" class="logout-btn">Logout</button></div></header><section class="workspace-kpi-grid"><div class="summary-card"><span>Total</span><strong id="totalCount">0</strong></div><div class="summary-card"><span>Unread</span><strong id="unreadCount">0</strong></div><div class="summary-card"><span>Escalations</span><strong id="escCount">0</strong></div><div class="summary-card"><span>Approvals</span><strong id="appCount">0</strong></div></section><section class="table-card"><div class="page-header"><h2>Notification Queue</h2><p>Role-wise operational alert queue.</p></div><table class="report-table"><thead><tr><th>Alert</th><th>Type</th><th>Priority</th><th>Assigned</th><th>Action</th></tr></thead><tbody id="notificationTable"></tbody></table></section></main></div><script src="./js/crm-common.js"></script><script>loadLayout('notifications');</script><script src="./js/notifications.js"></script></body></html>
