<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./css/styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><title>📑 Reports</title></head><body class="crm-v2"><div class="crm-layout"><div id="sidebarContainer"></div><main class="main-content"><header class="module-header"><div><span class="tag">Dealer CRM</span><h1>📑 Reports</h1></div><div class="module-actions"><div class="notification-box"><button onclick="toggleNotifications()" class="notification-btn">🔔 <span id="notificationCount">0</span></button><div id="notificationPanel" class="notification-panel"><h3>Notifications</h3><div id="notificationList"></div></div></div><button onclick="logout()" class="logout-btn">Logout</button></div></header><section class="filter-bar"><select id="reportRange"><option value="daily">Daily Report</option><option value="weekly">Weekly Report</option><option value="monthly">Monthly Report</option></select><button onclick="generateReport()" class="save-btn">Generate</button><button onclick="copyReport()" class="csv-btn">Copy Summary</button><button onclick="downloadReportCSV()" class="csv-btn">Download CSV</button></section><section class="module-card"><h2>Report Summary</h2><pre id="reportText" class="report-box">Select a report range and click Generate.</pre></section><section class="table-card"><table id="reportTable"><thead><tr><th>Name</th><th>Phone</th><th>Car</th><th>Source</th><th>Status</th><th>Priority</th><th>Assigned</th><th>Created</th></tr></thead><tbody></tbody></table></section></main></div><script src="./js/crm-common.js"></script><script>loadLayout('reports');</script><script src="./js/reports.js"></script></body></html>
