<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Showroom Enquiry</title><link rel="stylesheet" href="./css/styles.css"></head><body class="login-page nikrion-login-page"><div class="public-qr-shell"><div class="public-qr-card"><div class="nikrion-logo-mark"><span>N</span><i></i></div><h1>Showroom Enquiry</h1><p id="sessionInfo">Loading showroom session...</p><div class="form-grid"><div class="field-group"><label>Name *</label><input id="customerName"></div><div class="field-group"><label>Phone *</label><input id="phone"></div><div class="field-group"><label>Alternate Phone</label><input id="alternatePhone"></div><div class="field-group"><label>Email</label><input id="email"></div><div class="field-group"><label>Area</label><input id="area"></div><div class="field-group"><label>District</label><input id="district"></div><div class="field-group"><label>Pincode</label><input id="pincode"></div><div class="field-group"><label>Vehicle Category</label><select id="vehicleCategory"><option value="AD">Diesel / Petrol</option><option value="EV">Electric Vehicle</option></select></div><div class="field-group"><label>Fuel Type</label><input id="fuelType"></div><div class="field-group"><label>Model Interest</label><input id="carInterest"></div><div class="field-group"><label>Variant</label><input id="variantInterest"></div><div class="field-group"><label>Preferred Color</label><input id="preferredColor"></div></div><label>Notes</label><textarea id="notes"></textarea><div class="consent-box"><label><input type="checkbox" id="consentAccepted"><span id="consentText">I agree to data usage for service improvement and future suggestions.</span></label></div><button onclick="submitQrEnquiry()" class="login-btn nikrion-login-btn">Submit Enquiry</button><div id="message" class="login-message"></div></div></div><script src="./js/vehicle-intelligence-binding.js"></script>
<script src="./js/showroom-qr-public.js"></script></body></html>
