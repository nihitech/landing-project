<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>

    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="admin-page">

    <div class="admin-header">
        <div>
            <span class="tag">Sales CRM</span>
            <h1>My Leads Dashboard</h1>
        </div>

        <input 
            type="text" 
            id="searchInput" 
            placeholder="🔍 Search name or phone..." 
            oninput="loadLeads()"
        />

        <select id="filter" onchange="loadLeads()">
            <option value="">All Leads</option>
            <option value="HOT">🔥 HOT</option>
            <option value="WARM">🟡 WARM</option>
            <option value="COLD">⚪ COLD</option>
        </select>

        <div class="admin-user-box">
            <span id="userInfo"></span>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="dashboard-stats">
        <div class="dash-card">Total <span id="total">0</span></div>
        <div class="dash-card hot">HOT <span id="hot">0</span></div>
        <div class="dash-card warm">WARM <span id="warm">0</span></div>
        <div class="dash-card cold">COLD <span id="cold">0</span></div>
        <div class="dash-card">Enquiry <span id="enquiry">0</span></div>
        <div class="dash-card">Test Drive <span id="testdrive">0</span></div>
        <div class="dash-card">Closed <span id="closed">0</span></div>
    </div>


    <div class="chart-grid sales-chart-grid">
        <div class="chart-card">
            <h3>My Lead Priority</h3>
            <canvas id="priorityChart"></canvas>
        </div>

        <div class="chart-card">
            <h3>My Customer Actions</h3>
            <canvas id="actionChart"></canvas>
        </div>
    </div>

    <div class="pipeline">
        <div class="column" data-status="NEW">
            <h3>NEW</h3>
            <div class="dropzone" id="new"></div>
        </div>

        <div class="column" data-status="CONTACTED">
            <h3>CONTACTED</h3>
            <div class="dropzone" id="contacted"></div>
        </div>

        <div class="column" data-status="FOLLOW-UP">
            <h3>FOLLOW-UP</h3>
            <div class="dropzone" id="followup"></div>
        </div>

        <div class="column" data-status="CLOSED">
            <h3>CLOSED</h3>
            <div class="dropzone" id="closedZone"></div>
        </div>
    </div>

    <div class="table-card">
        <table id="leadTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Car</th>
                    <th>Action</th>
                    <th>Score</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="./js/user-dashboard.js"></script>
</body>
</html>
