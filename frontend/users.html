<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 User Management</title>

    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="crm-v2">
    <div class="crm-layout">
        <div id="sidebarContainer"></div>

        <main class="main-content">
            <header class="module-header">
                <div>
                    <span class="tag">Dealer CRM</span>
                    <h1>👤 User Management</h1>
                </div>

                <div class="module-actions">
                    <div class="notification-box">
                        <button onclick="toggleNotifications()" class="notification-btn">
                            🔔 <span id="notificationCount">0</span>
                        </button>

                        <div id="notificationPanel" class="notification-panel">
                            <h3>Notifications</h3>
                            <div id="notificationList"></div>
                        </div>
                    </div>

                    <button onclick="logout()" class="logout-btn">Logout</button>
                </div>
            </header>

            <section class="module-card">
                <h2 id="userFormTitle">Add User</h2>

                <input type="hidden" id="editUserId">

                <div class="user-form advanced-user-form">
                    <input id="u_user_code" placeholder="User Code e.g. SALES-001">

                    <input id="uname" placeholder="Name">

                    <input id="uemail" placeholder="Email">

                    <input id="uphone" placeholder="Phone">

                    <input id="upassword" type="password" placeholder="Password">

                    <select id="urole">
                        <option value="">Select Role</option>
                        <option value="sales">Sales</option>
                        <option value="admin">Admin</option>
                        <option value="manager">Manager</option>
                        <option value="telecaller">Telecaller</option>
                        <option value="marketing">Marketing</option>
                        <option value="field">Field Executive</option>
                        <option value="finance">Finance</option>
                        <option value="service">Service</option>
                        <option value="view_only">View Only</option>
                    </select>

                    <select id="u_department">
                        <option value="">Select Department</option>
                    </select>

                    <select id="u_branch">
                        <option value="">Select Branch</option>
                    </select>

                    <input id="u_designation" placeholder="Designation">

                    <select id="u_manager">
                        <option value="">Reporting Manager</option>
                    </select>

                    <select id="u_data_scope">
                        <option value="OWN">Own Data Only</option>
                        <option value="TEAM">Team Data</option>
                        <option value="DEPARTMENT">Department Data</option>
                        <option value="BRANCH">Branch Data</option>
                        <option value="ALL">All Data</option>
                        <option value="VIEW_ONLY">View Only</option>
                    </select>

                    <select id="u_status">
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>

                <div class="permission-box">
                    <h3>Permissions</h3>

                    <label><input type="checkbox" id="can_view" checked> View</label>
                    <label><input type="checkbox" id="can_create"> Create</label>
                    <label><input type="checkbox" id="can_edit"> Edit / Modify</label>
                    <label><input type="checkbox" id="can_assign"> Assign</label>
                    <label><input type="checkbox" id="can_delete"> Delete</label>
                    <label><input type="checkbox" id="can_export"> Export</label>
                    <label><input type="checkbox" id="can_monitor"> Monitor</label>
                </div>

                <div class="form-actions">
                    <button onclick="saveUser()" class="save-btn" id="saveUserBtn">Add User</button>
                    <button onclick="resetUserForm()" class="cancel-btn" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
                </div>
            </section>

            <section class="table-card">
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Contact</th>
                            <th>Department</th>
                            <th>Branch</th>
                            <th>Role / Scope</th>
                            <th>Permissions</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="./js/crm-common.js"></script>
    <script>loadLayout('users');</script>
    <script src="./js/users.js"></script>
</body>
</html>
