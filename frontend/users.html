<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./css/styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><title>👤 User Management</title></head><body class="crm-v2"><div class="crm-layout"><div id="sidebarContainer"></div><main class="main-content"><header class="module-header"><div><span class="tag">Dealer CRM</span><h1>👤 User Management</h1></div><div class="module-actions"><div class="notification-box"><button onclick="toggleNotifications()" class="notification-btn">🔔 <span id="notificationCount">0</span></button><div id="notificationPanel" class="notification-panel"><h3>Notifications</h3><div id="notificationList"></div></div></div><button onclick="logout()" class="logout-btn">Logout</button></div></header><section class="module-card"><h2>Add User</h2><div class="user-form"><input id="uname" placeholder="Name"><input id="uemail" placeholder="Email"><input id="uphone" placeholder="Phone with country code"><input id="upassword" type="password" placeholder="Password"><select id="urole"><option value="sales">Sales</option><option value="admin">Admin</option></select><button onclick="createUser()" class="save-btn">Add User</button></div></section><section class="table-card"><table id="userTable"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Action</th></tr></thead><tbody></tbody></table></section></main></div><script src="./js/crm-common.js"></script><script>loadLayout('users');</script><script src="./js/users.js"></script></body></html>
